    <script>
      // Suppress Vite dev client WebSocket connection failure in Cloud Run / iFrame preview sandbox.
      // In this environment, HMR WebSocket is not supported and fails with "WebSocket closed without opened."
      (function() {
        if (typeof window === 'undefined') return;

        try {
          var OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function (url, protocols) {
              var isViteHmr = 
                protocols === 'vite-hmr' || 
                protocols === 'vite-ping' || 
                (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
                (typeof url === 'string' && (url.includes('token=') && (url.includes('ais-dev') || url.includes('localhost'))));
                
              if (isViteHmr) {
                var target = new EventTarget();
                var mockSocket = {
                  readyState: 1, // WebSocket.OPEN
                  url: String(url),
                  protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  send: function () {},
                  close: function () {},
                  addEventListener: target.addEventListener.bind(target),
                  removeEventListener: target.removeEventListener.bind(target),
                  dispatchEvent: target.dispatchEvent.bind(target),
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
                setTimeout(function () {
                  var openEvent = new Event('open');
                  if (typeof mockSocket.onopen === 'function') mockSocket.onopen(openEvent);
                  mockSocket.dispatchEvent(openEvent);
                }, 0);
                return mockSocket;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || event.filename || (event.error && event.error.stack))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
